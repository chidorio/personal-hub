[project]
name = "personal-hub"
version = "0.1.0"
description = "Self-hosted personal hub: shared notes, files, Telegram bot, price watching"
readme = "README.md"
authors = [
    { name = "GG", email = "mymrin.gm@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
